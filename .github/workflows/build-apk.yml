name: Build debug APK

on:
  push:
    branches: [polish/interview-prep]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: re-turn-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-build-${{ github.run_number }}" \
            build/app/outputs/flutter-apk/app-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Test build #${{ github.run_number }}" \
            --notes "Debug APK for on-device testing, built from ${{ github.sha }}."
